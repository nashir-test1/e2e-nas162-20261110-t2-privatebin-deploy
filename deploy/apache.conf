ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <DirectoryMatch "^/var/www/html/(cfg|data|lib|vendor|tpl|doc|tst|bin)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^(\.|composer\.(json|lock)$)">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
